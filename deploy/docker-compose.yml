services:
  nexshield:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nexshield_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NEXSHIELD_PORT=5000
      - NEXSHIELD_HOST=0.0.0.0
      - MSF_HOST=msfrpcd
      - MSF_PORT=55553
      - MSF_PASSWORD=nexshield
    depends_on:
      msfrpcd:
        condition: service_started
    volumes:
      - nexshield_data:/app/data

  msfrpcd:
    image: metasploitframework/metasploit-framework
    container_name: nexshield_msf
    restart: unless-stopped
    ports:
      - "55553:55553"
    command: ./msfrpcd -P nexshield -U msf -n -f -a 0.0.0.0

volumes:
  nexshield_data:
