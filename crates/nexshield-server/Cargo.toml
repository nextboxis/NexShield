[package]
name = "nexshield-server"
version = "6.1.0"
edition = "2021"
authors = ["NexShield Core Team"]
description = "Pure Rust multithreaded HTTP/1.1 REST API & Web Dashboard Server for NexShield"

[dependencies]
nexshield-types = { path = "../nexshield-types" }
nexshield-core = { path = "../nexshield-core" }
nexshield-storage = { path = "../nexshield-storage" }
nexshield-cve = { path = "../nexshield-cve" }
nexshield-remediation = { path = "../nexshield-remediation" }
nexshield-notifier = { path = "../nexshield-notifier" }
nexshield-rag = { path = "../nexshield-rag" }
nexshield-exploit = { path = "../nexshield-exploit" }
nexshield-scanner = { path = "../nexshield-scanner" }
nexshield-engine = { path = "../nexshield-engine" }
nexshield-reports = { path = "../nexshield-reports" }

[[bin]]
name = "nexshield-server"
path = "src/main.rs"
