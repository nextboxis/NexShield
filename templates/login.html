<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexShield — Authenticate</title>
    <meta name="description" content="NexShield Mission Control — Secure Authentication Portal" />

    <!-- Inline SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23818cf8'/%3E%3Cstop offset='100%25' stop-color='%2334d399'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 4L6 18v20c0 14 12 20 26 22 14-2 26-8 26-22V18L32 4z' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Cpath d='M32 16l-14 8v12c0 8 6 12 14 14 8-2 14-6 14-14V24l-14-8z' fill='url(%23g)' opacity='.15'/%3E%3Cpath d='M28 32l-4-4 2-2 2 2 8-8 2 2z' fill='url(%23g)'/%3E%3C/svg%3E" />

    <!-- Google Font: Share Tech Mono + Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        :root {
            --bg-deep: #070a13;
            --cyan: #818cf8;
            --green: #34d399;
            --red: #f87171;
            --font-mono: 'Share Tech Mono', monospace;
            --font-sans: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-deep);
            color: #e2e8f0;
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto; /* Fix: allow scrolling on small viewports */
            padding: 2rem;
        }

        body::before {
            content: "";
            position: fixed; inset: 0; z-index: -1; pointer-events: none;
            background: 
                radial-gradient(circle at 15% 20%, rgba(129, 140, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(192, 132, 252, 0.06) 0%, transparent 45%);
        }

        /* Grid BG */
        .grid-bg {
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(129, 140, 248, 0.06) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
}
        @keyframes gridDrift { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }

        /* Radar sweep */
        .radar-sweep { display: none; 
            position: fixed; top: 50%; left: 50%;
            width: 200vmax; height: 200vmax;
            background: conic-gradient(from 0deg, transparent 0%, rgba(129, 140, 248, 0.06) 10%, transparent 15%);
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 1;
            animation: radarSweep 8s linear infinite;
         }
        @keyframes radarSweep { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

        .scanline-overlay { display: none; 
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(129, 140, 248, 0.008) 2px, rgba(129, 140, 248, 0.008) 4px);
            pointer-events: none; z-index: 1;
         }

        /* Login Card */
        .login-card {
            position: relative; z-index: 10;
            width: 100%; max-width: 440px;
            padding: 3rem 2.5rem;
            background: rgba(13, 20, 33, 0.85);
            border: 1px solid rgba(129, 140, 248, 0.12);
            border-radius: 20px;
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            animation: cardEntrance 0.8s ease-out;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Corner flourishes */
        .login-card::after {
            content: ''; position: absolute; top: -1px; right: -1px;
            width: 24px; height: 24px;
            border-top: 2px solid var(--cyan); border-right: 2px solid var(--cyan);
            border-radius: 0 20px 0 0; opacity: 0.5;
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        .login-card::before {
            content: ''; position: absolute; bottom: -1px; left: -1px;
            width: 24px; height: 24px;
            border-bottom: 2px solid var(--cyan); border-left: 2px solid var(--cyan);
            border-radius: 0 0 0 20px; opacity: 0.3;
        }

        .login-brand {
            text-align: center; margin-bottom: 2.5rem;
        }

        .login-brand__shield {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 20px rgba(129, 140, 248, 0.4));
            display: block; margin-bottom: 0.8rem;
        }

        .login-brand__title {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            letter-spacing: 4px;
            color: var(--cyan);
            text-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
        }

        .login-brand__sub {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: #8892a4;
            letter-spacing: 2px;
            margin-top: 0.4rem;
        }

        .login-form { display: flex; flex-direction: column; gap: 1.2rem; }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }

        .form-label {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            color: #8892a4;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .form-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(129, 140, 248, 0.15);
            color: #fff;
            font-family: var(--font-mono);
            padding: 0.85rem 1.2rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .form-input::placeholder {
            color: rgba(136, 146, 164, 0.4);
        }

        .form-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.12), inset 0 0 15px rgba(129, 140, 248, 0.03);
            background: rgba(129, 140, 248, 0.04);
        }

        .btn-auth {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            letter-spacing: 2px;
            padding: 0.95rem;
            border: 1px solid var(--cyan);
            border-radius: 8px;
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.12), rgba(52, 211, 153, 0.08));
            color: var(--cyan);
            cursor: pointer;
            transition: all 0.35s;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
        }

        .btn-auth:hover {
            background: linear-gradient(135deg, rgba(129, 140, 248, 0.25), rgba(52, 211, 153, 0.15));
            box-shadow: 0 0 25px rgba(129, 140, 248, 0.2);
            transform: translateY(-2px);
        }

        .btn-auth:active {
            transform: translateY(0);
        }

        .btn-auth:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .login-feedback {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            text-align: center;
            min-height: 1.4em;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        .login-feedback--error { color: var(--red); text-shadow: 0 0 10px rgba(255, 56, 96, 0.3); }
        .login-feedback--success { color: var(--green); text-shadow: 0 0 10px rgba(52, 211, 153, 0.3); }

        .login-hint {
            text-align: center;
            margin-top: 1.2rem;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: #8892a4;
            letter-spacing: 0.5px;
            opacity: 0.6;
        }

        /* Pulse ring behind card */
        .pulse-ring {
            position: fixed;
            top: 50%; left: 50%;
            width: 500px; height: 500px;
            border: 1px solid rgba(129, 140, 248, 0.05);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            animation: pulseRing 4s ease-out infinite;
        }

        @keyframes pulseRing {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
        }

        /* v6: Password toggle */
        .password-wrap {
            position: relative;
        }

        .password-wrap .form-input {
            padding-right: 3rem;
        }

        .pw-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8892a4;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.2s;
            line-height: 1;
        }

        .pw-toggle:hover {
            color: var(--cyan);
        }

        /* v6: Particle canvas */
        #particleCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* v6: System status indicator */
        .sys-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 1rem;
            font-family: var(--font-mono);
            font-size: 0.62rem;
            color: #556;
            letter-spacing: 1px;
        }

        .sys-status__dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #444;
            transition: all 0.3s;
        }

        .sys-status__dot.online {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .sys-status__dot.offline {
            background: var(--red);
            box-shadow: 0 0 6px var(--red);
        }

        /* v6: Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }

        .shake {
            animation: shake 0.5s ease;
        }

        /* v6: Success fade */
        @keyframes successFade {
            from { opacity: 1; }
            to { opacity: 0; transform: scale(0.96) translateY(-10px); }
        }

        .login-card--success {
            animation: successFade 0.8s ease 0.5s forwards;
        }

        /* v6: Responsive 320px */
        @media (max-width: 480px) {
            .login-card {
                max-width: calc(100vw - 24px);
                padding: 2rem 1.5rem;
                margin: 12px;
                border-radius: 14px;
            }

            .login-brand__title {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }

            .login-brand__shield {
                font-size: 2rem;
            }
        }

        /* v6: Prefers reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="grid-bg" aria-hidden="true"></div>
    <canvas id="particleCanvas" aria-hidden="true"></canvas>
    <div class="scanline-overlay" aria-hidden="true"></div>
    <div class="pulse-ring" aria-hidden="true"></div>

    <div class="login-card" id="loginCard">
        <div class="login-brand">
            <span class="login-brand__shield">🛡</span>
            <div class="login-brand__title">NEXSHIELD</div>
            <div class="login-brand__sub" id="brandSub"></div>
        </div>

        <form class="login-form" id="authForm" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label class="form-label" for="authUsername">OPERATOR_ID</label>
                <input type="text" id="authUsername" class="form-input" placeholder="Enter username" value="" autocomplete="username" required />
            </div>
            <div class="form-group">
                <label class="form-label" for="authPassword">ACCESS_KEY</label>
                <div class="password-wrap">
                    <input type="password" id="authPassword" class="form-input" placeholder="Enter password" value="" autocomplete="current-password" required />
                    <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">👁</button>
                </div>
            </div>
            <div class="login-feedback" id="authFeedback"></div>
            <button type="submit" class="btn-auth" id="authBtn">AUTHENTICATE</button>
        </form>

        <div class="sys-status" id="sysStatus">
            <span class="sys-status__dot" id="sysStatusDot"></span>
            <span id="sysStatusText">CHECKING_SYSTEM...</span>
        </div>
    </div>

    <script>
        // v6: Typing effect for subtitle
        (function initTypingEffect() {
            const subEl = document.getElementById('brandSub');
            if (!subEl) return;
            const text = 'SECURE_AUTHENTICATION_PORTAL';
            let i = 0;
            function typeChar() {
                if (i < text.length) {
                    subEl.textContent += text.charAt(i);
                    i++;
                    setTimeout(typeChar, 45 + Math.random() * 30);
                }
            }
            setTimeout(typeChar, 600);
        })();

        // v6: Canvas particle background
        (function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let particles = [];
            const PARTICLE_COUNT = 60;
            const MAX_DIST = 120;

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    r: Math.random() * 1.5 + 0.5
                });
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(129, 140, 248, 0.25)';
                    ctx.fill();

                    for (let j = i + 1; j < particles.length; j++) {
                        const q = particles[j];
                        const dx = p.x - q.x;
                        const dy = p.y - q.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < MAX_DIST) {
                            ctx.beginPath();
                            ctx.moveTo(p.x, p.y);
                            ctx.lineTo(q.x, q.y);
                            ctx.strokeStyle = `rgba(129, 140, 248, ${0.08 * (1 - dist / MAX_DIST)})`;
                            ctx.lineWidth = 0.5;
                            ctx.stroke();
                        }
                    }
                }

                requestAnimationFrame(draw);
            }
            draw();
        })();

        // v6: System status check
        (async function checkSystemStatus() {
            const dot = document.getElementById('sysStatusDot');
            const text = document.getElementById('sysStatusText');
            if (!dot || !text) return;
            try {
                const res = await fetch('/api/auth/session', { method: 'GET' });
                if (res.ok || res.status === 401) {
                    dot.classList.add('online');
                    text.textContent = 'SYSTEM_ONLINE';
                } else {
                    dot.classList.add('offline');
                    text.textContent = 'SYSTEM_DEGRADED';
                }
            } catch {
                dot.classList.add('offline');
                text.textContent = 'SYSTEM_UNREACHABLE';
            }
        })();

        // v6: Password visibility toggle
        function togglePasswordVisibility() {
            const pw = document.getElementById('authPassword');
            const btn = document.getElementById('pwToggle');
            if (!pw || !btn) return;
            if (pw.type === 'password') {
                pw.type = 'text';
                btn.textContent = '🙈';
            } else {
                pw.type = 'password';
                btn.textContent = '👁';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const btn = document.getElementById("authBtn");
            const feedback = document.getElementById("authFeedback");
            const card = document.getElementById("loginCard");
            const username = document.getElementById("authUsername").value.trim();
            const password = document.getElementById("authPassword").value.trim();
            const requestedNext = new URLSearchParams(window.location.search).get("next") || "/dashboard";

            if (!username || !password) {
                feedback.textContent = "All fields are required.";
                feedback.className = "login-feedback login-feedback--error";
                card.classList.remove('shake');
                void card.offsetWidth; /* reflow to restart animation */
                card.classList.add('shake');
                return;
            }

            btn.disabled = true;
            btn.textContent = "TRANSMITTING...";
            feedback.textContent = "";

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password, next: requestedNext }),
                });
                const data = await res.json();

                if (res.ok) {
                    feedback.textContent = "ACCESS_GRANTED \u2014 Redirecting to Mission Control...";
                    feedback.className = "login-feedback login-feedback--success";
                    card.classList.add('login-card--success');
                    setTimeout(() => {
                        const returnTo = data.redirect || "/dashboard";
                        window.location.href = returnTo;
                    }, 800);
                } else {
                    feedback.textContent = data.message || "Authentication failed.";
                    feedback.className = "login-feedback login-feedback--error";
                    card.classList.remove('shake');
                    void card.offsetWidth;
                    card.classList.add('shake');
                }
            } catch (err) {
                feedback.textContent = "CONNECTION_FAILURE \u2014 Server unreachable.";
                feedback.className = "login-feedback login-feedback--error";
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
            } finally {
                btn.disabled = false;
                btn.textContent = "AUTHENTICATE";
            }
        }
    </script>
</body>
</html>
